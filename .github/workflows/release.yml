name: Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build unsigned release APK
        run: ./gradlew assembleRelease
      - name: Sign APK with persistent release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          chmod 600 /tmp/release.keystore
          TOOLS="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools"
          APKSIGNER=$(find "$TOOLS" -name apksigner | sort | tail -n 1)
          ZIPALIGN=$(find "$TOOLS" -name zipalign | sort | tail -n 1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)
          "$ZIPALIGN" -c -p 4 "$UNSIGNED"
          mkdir -p dist
          SIGNED="dist/app-release.apk"
          "$APKSIGNER" sign --ks /tmp/release.keystore \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD --out "$SIGNED" "$UNSIGNED"
          "$APKSIGNER" verify --print-certs "$SIGNED"
          rm -f /tmp/release.keystore
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*.apk
